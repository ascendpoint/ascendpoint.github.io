<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}<link rel="canonical" href="{{canonical}}">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="AscendPoint Agency">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="{{image_w}}"><meta property="og:image:height" content="{{image_h}}">
{{article_meta}}<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="AscendPoint Agency: News &amp; Insights" href="{{base}}/feed.xml">
<meta name="theme-color" content="#003251">
<link rel="preload" href="/assets/fonts/albert-sans-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/montserrat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{css}}">
{{analytics_head}}{{jsonld}}
{{head_extra}}</head>
<body>
{{analytics_body}}{{header}}
<main id="main">
{{content}}
</main>
{{footer}}
<script src="{{js}}" defer></script>
</body>
</html>
