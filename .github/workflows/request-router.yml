name: Request router (Slack -> other sites' robots)

# Watches OTHER sites' website-request channels and wakes those sites' own robots. It never edits
# this site or any other: for each new request it reacts 📥 and sends a repository_dispatch to the
# site's repo (e.g. ascendpoint/serpdental-site for #serpdental-website-requests), where that site's
# robot does the work with a token that can only push to that repo. See tools/request_router.py.
#
# Lives here because this repo is public, so an always-on job costs nothing (the site repos are
# private). Same pattern as website-requests.yml: one ~5.7 h listener, restarted every 15 minutes.
#
# Needs: secrets SLACK_BOT_TOKEN (already set) + SERPDENTAL_DISPATCH_TOKEN (fine-grained token,
# ascendpoint/serpdental-site, Contents: read and write); variables ROUTES (channel=owner/repo, comma-
# separated) and ROUTER_START (unix time; ignore older messages). Optional ROUTER_ANY_THREAD (channels where a
# reply under ANY bot's post counts, e.g. #ad-intelligence so replies under a Zapier-posted daily report get answered).
# #ad-intelligence (C0C6JBR8LB1) routes to ascendpoint/ads-assistant, the ads Q&A robot.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      handoff:
        description: "Set by the previous listener when it hands over (waits for it to finish)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write    # the hand-off step starts the next router run

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.SERPDENTAL_DISPATCH_TOKEN }}
      ROUTES: ${{ vars.ROUTES }}
      ROUTER_START: ${{ vars.ROUTER_START }}
      ROUTER_ANY_THREAD: ${{ vars.ROUTER_ANY_THREAD }}
      ROUTER_OWNER: ${{ vars.WEBSITE_REQUESTS_OWNER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only one router at a time
        id: gate
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$DISPATCH_TOKEN" ] || [ -z "$ROUTES" ]; then
            echo "Not configured yet (SLACK_BOT_TOKEN / SERPDENTAL_DISPATCH_TOKEN / ROUTES); nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A hand-off run (started by the previous router as it finishes) waits up to 3 minutes for that
          # run to wrap up; a cron run just exits if a router is already going.
          for i in $(seq 1 18); do
            older=$(gh api "repos/${{ github.repository }}/actions/workflows/request-router.yml/runs?status=in_progress&per_page=20" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length")
            [ "${older:-0}" -eq 0 ] && break
            [ "${{ inputs.handoff }}" = "true" ] || break
            sleep 10
          done
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "${older:-0}" -gt 0 ]; then
            echo "A router is already running; exiting."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Route requests (~5.7 hours)
        if: steps.gate.outputs.go == 'true'
        env:
          LISTEN_MINUTES: "340"
        run: python3 tools/request_router.py listen

      # GitHub runs the 15-minute cron only every few hours on this repo, which left multi-hour gaps
      # with no router. So each router starts its successor when it finishes (workflow_dispatch is
      # one of the events a GITHUB_TOKEN may trigger). Not after a manual cancel (that's how you stop
      # it), and not if this run lasted under 5 minutes (a crash loop falls back to the cron instead).
      - name: Hand off to the next router
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        run: |
          ran=$(( $(date +%s) - ${{ steps.gate.outputs.started }} ))
          if [ "$ran" -lt 300 ]; then
            echo "Ran only ${ran}s; not handing off (the cron will start the next router)."
          else
            gh workflow run request-router.yml --ref "${{ github.ref_name }}" -f handoff=true
            echo "Next router started."
          fi
