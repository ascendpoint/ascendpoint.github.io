name: Website requests (Slack -> live site)

# Near-instant website changes from the #ascendpoint-website-requests Slack channel (and emails to
# website@ascendpoint.agency, which Slack posts into that channel).
#
# One "listener" run is always going: it polls the channel every 10 seconds for ~5.7 hours, and
# for each request lets Claude make the change, runs every site check, commits to main, publishes,
# and replies in the Slack thread. The cron below starts a fresh listener every 15 minutes; a new
# run exits straight away if an older listener is still running, so there is never more than one.
# Each listener also starts the next one when it finishes (see the last step), so there are no gaps. Free for public repositories.
# See tools/website_requests.py and README "Website requests".
#
# Needs: secrets SLACK_BOT_TOKEN + ANTHROPIC_API_KEY, variable SLACK_CHANNEL_ID.
# Optional variables: WEBSITE_REQUESTS_START (unix time; ignore older messages),
# WEBSITE_REQUESTS_ALLOWED (comma-separated Slack user IDs), WEBSITE_REQUESTS_OWNER (Slack user ID
# to @mention when something fails), CLAUDE_MODEL (default
# "sonnet"), CLAUDE_MAX_USD (default 3), POLL_SECONDS (default 10).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      handoff:
        description: "Set by the previous listener when it hands over (waits for it to finish)"
        required: false
        default: "false"

permissions:
  contents: write   # commit the change to main
  actions: write    # start the deploy workflow (pushes made with GITHUB_TOKEN don't trigger it)

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
      WEBSITE_REQUESTS_START: ${{ vars.WEBSITE_REQUESTS_START }}
      WEBSITE_REQUESTS_ALLOWED: ${{ vars.WEBSITE_REQUESTS_ALLOWED }}
      WEBSITE_REQUESTS_OWNER: ${{ vars.WEBSITE_REQUESTS_OWNER }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}   # needed when the key is org-level
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      CLAUDE_MAX_USD: ${{ vars.CLAUDE_MAX_USD }}
      CLAUDE_MODEL_ADVANCED: ${{ vars.CLAUDE_MODEL_ADVANCED }}     # design/motion/new-page work (default opus)
      CLAUDE_MAX_USD_ADVANCED: ${{ vars.CLAUDE_MAX_USD_ADVANCED }} # cap per advanced request (default 10)
      CLAUDE_MODEL_SIMPLE: ${{ vars.CLAUDE_MODEL_SIMPLE }}         # short text-only edits (default haiku)
      CLAUDE_MAX_USD_SIMPLE: ${{ vars.CLAUDE_MAX_USD_SIMPLE }}     # cap per simple request (default 1)
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}                         # Kinsta site deploying branch kinsta-preview
      POLL_SECONDS: ${{ vars.POLL_SECONDS }}
      LIVE_URL: ${{ vars.LIVE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only one listener at a time
        id: gate
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Not configured yet (SLACK_BOT_TOKEN / ANTHROPIC_API_KEY / SLACK_CHANNEL_ID); nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A hand-off run (started by the previous listener as it finishes) waits up to 3 minutes for that
          # run to wrap up; a cron run just exits if a listener is already going.
          for i in $(seq 1 18); do
            older=$(gh api "repos/${{ github.repository }}/actions/workflows/website-requests.yml/runs?status=in_progress&per_page=20" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length")
            [ "${older:-0}" -eq 0 ] && break
            [ "${{ inputs.handoff }}" = "true" ] || break
            sleep 10
          done
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "${older:-0}" -gt 0 ]; then
            echo "A listener is already running; exiting."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 0        # build.py takes sitemap dates from git history

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "22"

      - name: Install tools
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install -r tools/requirements-robot.txt
          python -m playwright install --with-deps chromium   # tools/screenshot.py: the robot looks at its work
          npm install -g @anthropic-ai/claude-code

      - name: Listen for requests (~5.7 hours)
        if: steps.gate.outputs.go == 'true'
        env:
          LISTEN_MINUTES: "340"
        run: python3 tools/website_requests.py listen

      # GitHub runs the 15-minute cron only every few hours on this repo, which left multi-hour gaps
      # with no listener. So each listener starts its successor when it finishes (workflow_dispatch is
      # one of the events a GITHUB_TOKEN may trigger). Not after a manual cancel (that's how you stop
      # it), and not if this run lasted under 5 minutes (a crash loop falls back to the cron instead).
      - name: Hand off to the next listener
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        run: |
          ran=$(( $(date +%s) - ${{ steps.gate.outputs.started }} ))
          if [ "$ran" -lt 300 ]; then
            echo "Ran only ${ran}s; not handing off (the cron will start the next listener)."
          else
            gh workflow run website-requests.yml --ref "${{ github.ref_name }}" -f handoff=true
            echo "Next listener started."
          fi
