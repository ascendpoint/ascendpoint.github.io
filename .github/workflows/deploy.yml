name: Build, check & deploy

# Every push to main:
#   1. builds the production site (canonical https://ascendpoint.agency) and runs every check
#      (tools/check.py + tools/test_redirects.py). Any failure stops here: nothing deploys.
#   2. publishes the built site to the `kinsta` branch. Kinsta (Sevalla static hosting) watches
#      that branch and redeploys automatically, usually within a minute.
#   3. publishes a noindex staging copy to GitHub Pages (https://ascendpoint.github.io).
# Pull requests run step 1 only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: sitemap <lastmod> comes from git dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif "opencv-python-headless>=4.8"   # tools/img_for_web.py + its tests
      - name: Website-robot tests
        run: python -m unittest discover -s tests
      - name: Build + check (production)
        run: python tools/build.py --env production --base-url https://ascendpoint.agency
      - name: Build + check (staging)
        run: DIST_DIR=dist-staging python tools/build.py --env staging --base-url https://ascendpoint.github.io
      - uses: actions/upload-artifact@v4
        with:
          name: site-production
          path: dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist-staging

  kinsta:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-production
          path: dist
      - name: Publish dist/ to the kinsta branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          git clone --quiet --depth 1 --branch kinsta "https://x-access-token:${TOKEN}@github.com/${REPO}.git" out \
            || { git init --quiet out && git -C out checkout --quiet -b kinsta && git -C out remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"; }
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. out/
          cd out
          git config user.name "AscendPoint site bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy"; exit 0; fi
          git commit --quiet -m "Deploy ${SHA::7}: ${MSG%%$'\n'*}"
          git push --quiet origin kinsta
          echo "Published ${SHA::7} to kinsta branch"
      - name: Tell Kinsta to deploy the new build
        # The Kinsta (Sevalla) static site is connected to the public repo URL, so it is told to
        # redeploy through the Sevalla API. Needs repo secret SEVALLA_API_KEY and variable
        # SEVALLA_SITE_ID (the static site's UUID). Skipped if either is missing.
        env:
          KEY: ${{ secrets.SEVALLA_API_KEY }}
          SITE: ${{ vars.SEVALLA_SITE_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SITE" ]; then echo "Sevalla deploy trigger not configured; skipping"; exit 0; fi
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "https://api.sevalla.com/v3/static-sites/${SITE}/deployments" \
            -H "Authorization: Bearer ${KEY}" -H "Content-Type: application/json" -d '{"branch":"kinsta"}')
          echo "Sevalla responded ${code}"; head -c 400 resp.json; echo
          [ "$code" = "201" ] || [ "$code" = "200" ] || exit 1

  pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    # After Kinsta picks up the kinsta branch, test the real host: every page, every old
    # WordPress URL, headers, 404. Set the repository variable LIVE_URL to the site's
    # address (the *.sevalla.page preview now; https://ascendpoint.agency after go-live).
    if: github.event_name != 'pull_request' && vars.LIVE_URL != ''
    needs: kinsta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/live_check.py "${{ vars.LIVE_URL }}" --wait-for "${{ github.sha }}"
